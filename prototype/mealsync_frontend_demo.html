<!DOCTYPE html>
<html lang="en">
<head>
  <!-- BLOCK 1: Document metadata. This prototype intentionally needs no external libraries or network access. -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#174a3a" />
  <title>MealSync — Community Food, Better Coordinated</title>

  <!-- BLOCK 2: Design tokens, reset, and typography. Keep shared colors/spacing here when splitting into CSS files. -->
  <style>
    :root {
      --forest: #174a3a;
      --forest-2: #23664f;
      --forest-3: #2f7a5e;
      --mint: #e5f2e9;
      --mint-2: #d2e8d9;
      --lime: #d9eca9;
      --lime-2: #edf5d6;
      --orange: #ed8a54;
      --orange-soft: #fff0e5;
      --blue: #467ea2;
      --blue-soft: #eaf3f8;
      --purple: #7c67ad;
      --purple-soft: #f0ecfa;
      --ink: #20332b;
      --muted: #728079;
      --muted-2: #9aa59e;
      --line: #e5eae5;
      --line-strong: #d6dfd8;
      --canvas: #f5f7f3;
      --surface: #ffffff;
      --surface-2: #fafcf9;
      --red: #b64a3b;
      --red-soft: #fff0ed;
      --amber: #a76a16;
      --amber-soft: #fff6df;
      --green: #2c7956;
      --green-soft: #e8f7ed;
      --shadow: 0 10px 30px rgba(26, 54, 40, 0.07);
      --shadow-lg: 0 24px 70px rgba(19, 47, 34, 0.18);
      --radius: 18px;
      --radius-sm: 11px;
      --sidebar-width: 246px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; color: var(--ink); background: var(--canvas); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; line-height: 1.5; }
    button, input, select, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    h1, h2, h3, h4, p { margin-top: 0; }
    h1, h2, h3, h4 { letter-spacing: -0.035em; }
    ::selection { background: var(--lime); color: var(--forest); }

    /* BLOCK 3: Reusable controls: buttons, chips, labels, forms, and avatars. */
    .btn { border: 1px solid transparent; border-radius: 10px; padding: 10px 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 680; font-size: 13px; transition: transform .15s ease, background .15s ease, border .15s ease; white-space: nowrap; }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-primary { color: white; background: var(--forest); box-shadow: 0 5px 12px rgba(23, 74, 58, .12); }
    .btn-primary:hover { background: var(--forest-2); }
    .btn-secondary { color: var(--forest); background: white; border-color: var(--line-strong); }
    .btn-secondary:hover { background: var(--surface-2); border-color: #b9cbbd; }
    .btn-quiet { color: var(--muted); background: transparent; }
    .btn-quiet:hover { color: var(--forest); background: var(--mint); }
    .btn-lime { color: var(--forest); background: var(--lime); }
    .btn-lime:hover { background: #cce493; }
    .btn-danger { color: var(--red); background: var(--red-soft); border-color: #f7d7d0; }
    .btn-sm { padding: 7px 10px; border-radius: 8px; font-size: 12px; }
    .btn-block { width: 100%; }
    .icon-btn { width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 11px; display: inline-grid; place-items: center; color: var(--muted); background: white; position: relative; }
    .icon-btn:hover { border-color: var(--line-strong); color: var(--forest); }
    .eyebrow { color: var(--forest-2); font-size: 11px; text-transform: uppercase; letter-spacing: .13em; font-weight: 800; }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    .tiny { font-size: 11px; }
    .text-right { text-align: right; }
    .mono { font-variant-numeric: tabular-nums; }
    .pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 5px 9px; background: #f0f3f0; color: #52645a; font-size: 11px; font-weight: 750; white-space: nowrap; }
    .pill.green { color: var(--green); background: var(--green-soft); }
    .pill.orange { color: #9b4d25; background: var(--orange-soft); }
    .pill.blue { color: #356b8f; background: var(--blue-soft); }
    .pill.purple { color: #695392; background: var(--purple-soft); }
    .pill.amber { color: var(--amber); background: var(--amber-soft); }
    .pill.red { color: var(--red); background: var(--red-soft); }
    .status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #68ad7c; margin-right: 2px; }
    .avatar { width: 36px; height: 36px; flex: 0 0 auto; display: inline-grid; place-items: center; border-radius: 12px; color: var(--forest); background: var(--mint); font-size: 12px; font-weight: 850; }
    .avatar.orange { color: #9b4d25; background: #ffeadc; }
    .avatar.blue { color: #315f80; background: #e0edf6; }
    .avatar.purple { color: #65508b; background: #eee8f9; }
    .avatar.lime { background: var(--lime); }
    .avatar.round { border-radius: 50%; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: #394b41; font-size: 12px; font-weight: 750; }
    .field input, .field select, .field textarea, .search-input { width: 100%; border: 1px solid var(--line-strong); outline: none; border-radius: 10px; background: #fff; color: var(--ink); padding: 11px 12px; min-width: 0; }
    .field textarea { resize: vertical; min-height: 88px; }
    .field input:focus, .field select:focus, .field textarea:focus, .search-input:focus { border-color: #6d9b7f; box-shadow: 0 0 0 3px rgba(83, 145, 103, .12); }
    .field .hint { color: var(--muted); font-size: 11px; }
    .check-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    .check-option { display: flex; align-items: flex-start; gap: 9px; border: 1px solid var(--line); border-radius: 11px; padding: 11px; cursor: pointer; }
    .check-option:has(input:checked) { border-color: #8fb79c; background: #f5fbf6; }
    .check-option input { accent-color: var(--forest); margin-top: 3px; }
    .check-option strong { display: block; font-size: 12px; }
    .check-option span { display: block; color: var(--muted); font-size: 11px; line-height: 1.4; margin-top: 2px; }

    /* BLOCK 4: Public landing page and its sections. */
    .landing { min-height: 100vh; background: #fbfcf9; overflow: hidden; }
    .landing-nav { max-width: 1200px; margin: auto; padding: 22px 28px; display: flex; align-items: center; gap: 28px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--forest); font-weight: 900; letter-spacing: -.055em; font-size: 22px; }
    .brand-symbol { width: 35px; height: 35px; display: inline-grid; place-items: center; border-radius: 12px; background: var(--forest); color: var(--lime); font-size: 19px; letter-spacing: 0; transform: rotate(-4deg); }
    .landing-links { display: flex; align-items: center; gap: 28px; margin-left: auto; color: #59675e; font-weight: 650; font-size: 13px; }
    .landing-links a:hover { color: var(--forest); }
    .landing-actions { display: flex; align-items: center; gap: 10px; }
    .hero { max-width: 1200px; margin: auto; padding: 70px 28px 58px; display: grid; grid-template-columns: 1fr 1.05fr; align-items: center; gap: 38px; }
    .hero-copy h1 { font-size: clamp(42px, 5.2vw, 68px); line-height: 1.03; max-width: 620px; margin: 16px 0 20px; color: #1a3529; }
    .hero-copy h1 em { font-style: normal; color: var(--forest-3); position: relative; white-space: nowrap; }
    .hero-copy h1 em::after { content: ""; position: absolute; height: 11px; border-radius: 50%; bottom: 0px; left: 0; right: 0; background: var(--lime); z-index: -1; transform: rotate(-1.5deg); }
    .hero-copy > p { font-size: 16px; max-width: 515px; line-height: 1.75; color: #66736b; margin-bottom: 26px; }
    .hero-ctas { display: flex; gap: 11px; flex-wrap: wrap; }
    .hero-note { display: flex; align-items: center; gap: 10px; margin-top: 25px; color: var(--muted); font-size: 11px; }
    .mini-avatars { display: flex; }
    .mini-avatars .avatar { width: 27px; height: 27px; border: 2px solid #fbfcf9; margin-left: -7px; border-radius: 50%; font-size: 9px; }
    .mini-avatars .avatar:first-child { margin-left: 0; }
    .hero-visual { position: relative; min-width: 0; }
    .hero-glow { position: absolute; inset: 8% 4% 0 8%; border-radius: 35% 45% 38% 48%; background: linear-gradient(140deg, #edf4da, #daecdf); transform: rotate(3deg); }
    .hero-dashboard { position: relative; margin: 12px 14px 15px 4px; background: white; border: 1px solid #e3e9e2; border-radius: 24px; padding: 21px; box-shadow: 0 25px 75px rgba(35, 86, 57, .15); transform: rotate(-1.7deg); }
    .preview-top { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 15px; }
    .preview-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 17px 0; }
    .preview-kpi { background: #f7faf5; border-radius: 12px; padding: 13px 11px; }
    .preview-kpi strong { font-size: 24px; color: var(--forest); display: block; letter-spacing: -.06em; }
    .preview-kpi span { display: block; font-size: 10px; color: var(--muted); margin-top: 2px; }
    .preview-row { display: flex; align-items: center; gap: 11px; border: 1px solid var(--line); border-radius: 13px; padding: 11px; margin-top: 9px; }
    .preview-row .grow { flex: 1; min-width: 0; }
    .preview-row strong { display: block; font-size: 12px; }
    .preview-row small { display: block; font-size: 10px; color: var(--muted); }
    .floating-note { position: absolute; right: -4px; top: 5%; background: white; border: 1px solid #e7ece6; border-radius: 13px; box-shadow: var(--shadow); padding: 12px 14px; max-width: 190px; transform: rotate(3deg); }
    .floating-note.bottom { right: auto; top: auto; bottom: 0; left: -20px; transform: rotate(-3deg); }
    .floating-note strong { display: block; font-size: 12px; }
    .floating-note span { color: var(--muted); font-size: 10px; }
    .landing-trust { max-width: 1200px; padding: 22px 28px 42px; margin: auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-top: 1px solid #e9eee8; color: var(--muted); font-size: 11px; }
    .trust-logos { display: flex; flex-wrap: wrap; gap: 24px; color: #647166; font-weight: 800; letter-spacing: -.02em; }
    .landing-section { padding: 85px 28px; }
    .landing-section.white { background: white; }
    .section-inner { max-width: 1120px; margin: auto; }
    .section-title { max-width: 620px; margin: 0 auto 42px; text-align: center; }
    .section-title h2 { font-size: clamp(30px, 3.5vw, 42px); line-height: 1.13; margin: 12px 0; }
    .section-title p { color: var(--muted); line-height: 1.75; }
    .feature-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .feature-card { border: 1px solid var(--line); border-radius: 18px; background: white; padding: 23px; min-height: 215px; }
    .feature-card .feature-icon { width: 45px; height: 45px; display: grid; place-items: center; border-radius: 14px; background: var(--mint); font-size: 21px; margin-bottom: 18px; }
    .feature-card:nth-child(2) .feature-icon { background: var(--orange-soft); }
    .feature-card:nth-child(3) .feature-icon { background: var(--blue-soft); }
    .feature-card:nth-child(4) .feature-icon { background: var(--purple-soft); }
    .feature-card h3 { font-size: 16px; margin-bottom: 8px; }
    .feature-card p { color: var(--muted); font-size: 12px; line-height: 1.7; margin: 0; }
    .steps-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 34px; }
    .step-number { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 12px; color: var(--forest); font-weight: 900; background: var(--lime); margin-bottom: 15px; }
    .steps-grid h3 { margin-bottom: 8px; }
    .steps-grid p { margin: 0; color: var(--muted); line-height: 1.7; }
    .landing-cta { max-width: 1120px; margin: 0 auto; padding: 50px; background: var(--forest); border-radius: 25px; color: white; display: flex; align-items: center; justify-content: space-between; gap: 25px; }
    .landing-cta h2 { font-size: 34px; margin: 0 0 8px; line-height: 1.1; }
    .landing-cta p { color: #d0dfd5; margin: 0; }
    .landing-footer { max-width: 1200px; margin: auto; padding: 28px; display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; gap: 16px; }

    /* BLOCK 5: Authentication pages. These are demonstration forms only; no credentials are sent to a server. */
    .auth-page { min-height: 100vh; background: #f7f9f5; display: grid; grid-template-columns: minmax(320px, .9fr) 1.1fr; }
    .auth-art { background: var(--forest); padding: 38px; color: white; display: flex; flex-direction: column; position: relative; overflow: hidden; }
    .auth-art::before, .auth-art::after { content: ""; position: absolute; width: 360px; height: 360px; border: 1px solid rgba(220, 239, 198, .22); border-radius: 46% 54% 62% 38%; bottom: -80px; right: -120px; transform: rotate(27deg); }
    .auth-art::after { width: 250px; height: 250px; bottom: -35px; right: -55px; border-color: rgba(220, 239, 198, .32); }
    .auth-art .brand { color: white; position: relative; z-index: 1; }
    .auth-art .brand-symbol { color: var(--forest); background: var(--lime); }
    .auth-art-copy { max-width: 430px; margin: auto; position: relative; z-index: 1; padding: 45px 0; }
    .auth-art-copy h1 { font-size: 46px; line-height: 1.08; margin: 15px 0; }
    .auth-art-copy p { color: #d6e2da; line-height: 1.8; }
    .auth-bullet { display: flex; gap: 11px; align-items: flex-start; margin-top: 22px; color: #e6f1e9; font-size: 13px; }
    .auth-bullet b { color: var(--lime); }
    .auth-main { padding: 34px; display: flex; align-items: center; justify-content: center; }
    .auth-card { width: 100%; max-width: 500px; background: white; border: 1px solid var(--line); border-radius: 22px; padding: 34px; box-shadow: var(--shadow); }
    .auth-card h2 { font-size: 28px; margin: 8px 0; }
    .auth-card > p { color: var(--muted); margin-bottom: 25px; }
    .auth-card form { display: grid; gap: 16px; }
    .auth-switch { text-align: center; color: var(--muted); font-size: 12px; margin: 20px 0 0; }
    .linkish { color: var(--forest-2); font-weight: 800; cursor: pointer; }
    .demo-note { border-radius: 10px; background: #f6f8ed; border: 1px solid #e7edce; color: #58634b; padding: 10px 12px; font-size: 11px; margin-top: 14px; }

    /* BLOCK 6: Authenticated application shell: responsive sidebar, header and role tabs. */
    .app-shell { min-height: 100vh; display: grid; grid-template-columns: var(--sidebar-width) minmax(0, 1fr); }
    .sidebar { min-height: 100vh; position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--forest); color: #d8e6dc; padding: 22px 14px 16px; display: flex; flex-direction: column; z-index: 20; }
    .sidebar .brand { color: white; padding: 0 10px; margin-bottom: 30px; font-size: 21px; }
    .sidebar .brand-symbol { color: var(--forest); background: var(--lime); }
    .nav-label { margin: 17px 12px 8px; color: #88a899; text-transform: uppercase; letter-spacing: .13em; font-size: 9px; font-weight: 900; }
    .side-nav { display: grid; gap: 4px; }
    .nav-item { border: 0; width: 100%; display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 10px; color: #d0e0d5; text-align: left; background: transparent; font-weight: 650; font-size: 12px; }
    .nav-item .nav-icon { font-size: 15px; width: 19px; text-align: center; opacity: .9; }
    .nav-item:hover { background: rgba(255,255,255,.08); color: white; }
    .nav-item.active { background: var(--lime); color: var(--forest); font-weight: 850; }
    .nav-item .nav-count { margin-left: auto; min-width: 20px; text-align: center; border-radius: 8px; padding: 2px 5px; background: rgba(255,255,255,.1); font-size: 10px; }
    .nav-item.active .nav-count { background: rgba(23,74,58,.12); }
    .sidebar-spacer { flex: 1; min-height: 24px; }
    .sidebar-callout { margin: 16px 3px 14px; border: 1px solid rgba(222,239,225,.17); background: rgba(255,255,255,.055); padding: 14px; border-radius: 13px; }
    .sidebar-callout strong { display: block; font-size: 12px; color: white; }
    .sidebar-callout p { color: #a9c3b2; font-size: 10px; margin: 6px 0 11px; line-height: 1.6; }
    .sidebar-callout button { color: var(--forest); background: var(--lime); border: 0; width: 100%; border-radius: 8px; padding: 8px; font-size: 11px; font-weight: 850; }
    .sidebar-user { display: flex; align-items: center; gap: 9px; padding: 12px 8px 0; border-top: 1px solid rgba(230,244,234,.15); }
    .sidebar-user .avatar { width: 31px; height: 31px; background: #f2c7a7; color: #653b25; }
    .sidebar-user .user-mini { min-width: 0; flex: 1; }
    .sidebar-user strong { display: block; color: white; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sidebar-user small { display: block; color: #9ab5a4; font-size: 9px; }
    .sidebar-user button { border: 0; background: transparent; color: #a9c1b2; padding: 5px; }
    .main-column { min-width: 0; }
    .topbar { padding: 15px 30px 11px; display: flex; align-items: center; justify-content: space-between; gap: 20px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.9); position: sticky; top: 0; z-index: 15; backdrop-filter: blur(12px); }
    .breadcrumbs { color: var(--muted); font-size: 11px; margin-bottom: 2px; }
    .topbar-title { font-size: 16px; font-weight: 850; letter-spacing: -.03em; }
    .topbar-right { display: flex; align-items: center; gap: 11px; }
    .global-search { width: 205px; position: relative; }
    .global-search input { border: 1px solid var(--line); border-radius: 10px; width: 100%; padding: 9px 12px 9px 33px; outline: none; background: #fbfcfa; font-size: 11px; }
    .global-search .search-glyph { position: absolute; left: 12px; top: 8px; color: #8a988e; }
    .topbar-profile { display: flex; align-items: center; gap: 8px; border: 0; background: transparent; text-align: left; padding: 2px; }
    .topbar-profile .avatar { width: 31px; height: 31px; background: #f2c7a7; color: #653b25; }
    .topbar-profile strong { display: block; font-size: 11px; }
    .topbar-profile small { display: block; color: var(--muted); font-size: 9px; }
    .role-tabs { display: flex; align-items: center; gap: 6px; padding: 10px 30px; border-bottom: 1px solid var(--line); background: white; overflow-x: auto; }
    .role-tab { border: 1px solid transparent; color: var(--muted); font-size: 11px; font-weight: 800; border-radius: 8px; padding: 8px 12px; background: transparent; white-space: nowrap; }
    .role-tab:hover { background: #f4f7f3; color: var(--forest); }
    .role-tab.active { background: var(--mint); color: var(--forest); }
    .role-tab .role-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; background: var(--forest-3); margin-right: 5px; }
    .page-content { padding: 29px 30px 50px; max-width: 1600px; margin: auto; }
    .page-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 22px; }
    .page-heading h1 { font-size: 27px; margin: 5px 0 5px; line-height: 1.15; }
    .page-heading p { color: var(--muted); margin: 0; font-size: 12px; }
    .heading-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .layout-grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(275px, 1fr); gap: 18px; align-items: start; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 15px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 13px; }
    .stack { display: grid; gap: 17px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 2px 5px rgba(28, 56, 38, .015); min-width: 0; }
    .card-pad { padding: 20px; }
    .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 17px; }
    .card-head h2, .card-head h3 { margin: 0 0 4px; font-size: 15px; letter-spacing: -.025em; }
    .card-head p { margin: 0; color: var(--muted); font-size: 11px; }
    .card-head .text-action { color: var(--forest-2); font-size: 11px; font-weight: 850; background: transparent; border: 0; padding: 4px 0; }
    .metric-card { padding: 17px 18px; position: relative; overflow: hidden; }
    .metric-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 13px; }
    .metric-icon { width: 35px; height: 35px; display: grid; place-items: center; border-radius: 11px; background: var(--mint); color: var(--forest); font-size: 15px; }
    .metric-icon.orange { background: var(--orange-soft); }
    .metric-icon.blue { background: var(--blue-soft); }
    .metric-icon.purple { background: var(--purple-soft); }
    .metric-label { color: var(--muted); font-size: 11px; font-weight: 650; }
    .metric-value { font-size: 28px; font-weight: 900; letter-spacing: -.06em; line-height: 1.1; margin: 3px 0 7px; }
    .metric-foot { color: var(--muted); font-size: 10px; }
    .metric-foot .positive { color: var(--green); font-weight: 850; }
    .section-spacer { margin-top: 22px; }
    .event-list { display: grid; gap: 11px; }
    .event-row { display: flex; align-items: center; gap: 13px; padding: 13px; border: 1px solid var(--line); border-radius: 13px; min-width: 0; transition: border .15s ease, box-shadow .15s ease; }
    .event-row:hover { border-color: #c8d8cc; box-shadow: 0 4px 15px rgba(33,75,49,.05); }

    function renderEstimate(recipeId, servings) {

      return `<div style="border:1px solid var(--line);border-radius:11px;padding:12px"><div class="small muted" style="margin-bottom:8px">For ${servings} servings of <strong>${escapeHTML(recipe.name)}</strong></div>${recipe.ingredients.map(ing=>{const needed=ing.amount*servings;const stock=appState.inventory.find(i=>i.ingredient.toLowerCase()===ing.name.toLowerCase());const enough=stock?stock.quantity>=needed:null;return `<div class="list-row" style="padding:8px 0"><div class="grow"><strong>${escapeHTML(ing.name)}</strong><small>${stock?`On hand: ${stock.quantity} ${stock.unit}`:"Stock not tracked"}</small></div><div class="text-right"><strong>${needed.toLocaleString("en-IN",{maximumFractionDigits:2})} ${escapeHTML(ing.unit)}</strong><small class="${enough===false?"":"muted"}" style="display:block;color:${enough===false?"var(--red)":"var(--muted)"}">${enough===true?"Enough in stock":enough===false?"Shortage":"Not checked"}</small></div></div>`}).join("")}</div>`;
    }

      const bars = appState.demands.map(d=>`<div class="bar-group"><div class="bar-pair"><span class="bar" style="height:${d.estimated/max*100}%" title="Estimated ${d.estimated}"></span><span class="bar secondary" style="height:${(d.actual||0)/max*100}%" title="Actual ${d.actual||"not recorded"}"></span></div><span class="bar-label">${escapeHTML(d.date.slice(8)+" Oct")}</span></div>`).join("");

    // BLOCK 29: Page router and re-render orchestration. Pages are separate functions for easy React migration. 
    function renderPage(page = appState.page) {
      appState.page = page;
      appState.view = "app";
      const renderers = {
        dashboard: renderDashboard, volunteer: renderVolunteer, donor: renderDonor, organizer: renderOrganizer, kitchens: renderKitchens,
        inventory: renderInventory, recipes: renderRecipes, "meal-planner": renderMealPlanner, analytics: renderAnalytics,
        opportunities: renderOpportunities, events: renderEvents, profile: renderProfile
      };
      const content = (renderers[page] || renderDashboard)();
      renderShell(content);
      if(page === "meal-planner") updateRecipeEstimate();
    }
    function navigate(page) {
      const valid = new Set(["dashboard","volunteer","donor","organizer","kitchens","inventory","recipes","meal-planner","analytics","opportunities","events","profile"]);
      if(!valid.has(page)) page = "dashboard";
      const requiredRole = ({ volunteer:"volunteer", donor:"donor", organizer:"organization", kitchens:"kitchen", inventory:"kitchen", recipes:"kitchen", "meal-planner":"kitchen", analytics:"kitchen" })[page];
      if(requiredRole && !appState.user.roles.includes(requiredRole)) {
        showToast("Role is not active", `Activate ${roleInfo[requiredRole]?.label || "this role"} in your profile first.`);
        return;
      }
      appState.page = page;
      appState.activeRole = ({ dashboard:"for-you", volunteer:"volunteer", donor:"donor", organizer:"organization", kitchens:"kitchen", inventory:"kitchen", recipes:"kitchen", "meal-planner":"kitchen", analytics:"kitchen", profile:appState.activeRole }[page] || appState.activeRole);
      renderPage(page);
      const sidebar = $("#sidebar"); if(sidebar) sidebar.classList.remove("open");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
    function setActiveRole(role) {
      if(role !== "for-you" && !appState.user.roles.includes(role)) {
        showToast("Role is not active", `Activate ${roleInfo[role]?.label || "this role"} in your profile first.`);
        return;
      }
      appState.activeRole = role;
      const page = ({"for-you":"dashboard",volunteer:"volunteer",donor:"donor",organization:"organizer",kitchen:"kitchens"})[role] || "dashboard";
      navigate(page);
    }

    function formDataObject(form) {

        if(obj[key] !== undefined) obj[key] = Array.isArray(obj[key]) ? [...obj[key],value] : [obj[key],value];
        else obj[key]=value;
      }
      return obj;
    }

        case "create-donation-request": {
          const k=appState.kitchens.find(k=>k.name===data.recipient)||currentKitchen(); const isMoney=data.type==="Money";
          appState.donationRequests.unshift({id:Math.max(0,...appState.donationRequests.map(r=>r.id))+1,title:data.title,recipient:data.recipient,place:k.place,type:data.type,need:data.need,progress:0,deadline:new Date(data.deadline+"T12:00:00").toLocaleDateString("en-IN",{day:"2-digit",month:"short"}),icon:isMoney?"💚":"🌾",tone:isMoney?"blue":"green",description:data.description});
          addActivity(`Published donation request: ${data.title}`); closeModal(); renderPage(appState.page); showToast("Donation request published"); break;
        }
        case "add-chef": {
          const id=Math.max(0,...appState.chefs.map(c=>c.id))+1; appState.chefs.push({id,name:data.name,role:data.role,initials:initials(data.name)}); closeModal(); renderPage(appState.page); showToast("Chef added to the demo roster"); break;
        }
        default: closeModal();
      }
    }

    // BLOCK 33: Global click/action router. Every visible demo control either navigates, updates local state, or explains the unavailable backend feature. 
    document.addEventListener("click", event => {
      const nav = event.target.closest("[data-nav]");
      if(nav) { event.preventDefault(); navigate(nav.dataset.nav); return; }
      const role = event.target.closest("[data-role]");
      if(role) { setActiveRole(role.dataset.role); return; }
      const button = event.target.closest("[data-action]"); if(!button) return;
      const action=button.dataset.action; const id=button.dataset.id;
      switch(action) {
        case "landing": appState.view="landing"; renderLanding(); window.scrollTo({top:0,behavior:"smooth"}); break;
        case "explore-demo": appState.activeRole="for-you"; navigate("dashboard"); showToast("Interactive demo opened", "Explore all four roles using the top role tabs."); break;
        case "show-login": renderAuth("login"); break;
        case "show-signup": renderAuth("signup"); break;
        case "go-dashboard": navigate("dashboard"); break;
        case "sign-out": closeModal(); appState.view="landing"; renderLanding(); showToast("Signed out of demo", "No server session exists in this prototype."); break;
        case "toggle-sidebar": $("#sidebar")?.classList.toggle("open"); break;
        case "close-modal": closeModal(); break;
        case "backdrop-close": if(event.target.classList.contains("modal-backdrop"))closeModal(); break;
        case "create-event": openEventModal(); break;
        case "edit-event": openEventModal(Number(id)); break;
        case "event-details": showEventDetails(Number(id)); break;
        case "register-event": {
          const e=currentEvent(id); if(!e)return;
          if(isRegistered(id))return;
          if(e.volunteers>=e.needed){showToast("Event is full","The organizer needs to add more volunteer slots.");return;}
          appState.registeredEventIds.push(Number(id)); e.volunteers+=1; addActivity(`Registered for ${e.title}`); const wasModal=!!$("#modal-root .modal"); if(wasModal) closeModal(); renderPage(appState.page); showToast("You're registered", `Your demo registration for ${e.title} is saved on this page.`); break;
        }
        case "unregister-event": {
          const e=currentEvent(id); appState.registeredEventIds=appState.registeredEventIds.filter(n=>n!==Number(id)); if(e)e.volunteers=Math.max(0,e.volunteers-1); if($("#modal-root .modal"))closeModal(); renderPage(appState.page); showToast("Registration cancelled"); break;
        }
        case "donate": openDonationModal(id?Number(id):null); break;
        case "create-donation-request": openDonationRequestModal(); break;
        case "stock-adjust": openStockModal(id?Number(id):null); break;
        case "add-ingredient": openAddIngredientModal(); break;
        case "schedule-meal": openScheduleModal(); break;
        case "view-schedule": showScheduleDetails(id); break;
        case "add-recipe": openRecipeModal(); break;
        case "recipe-details": showRecipeDetails(id); break;
        case "refresh-estimate": updateRecipeEstimate(); showToast("Estimate recalculated", "Compares recipe requirements with current demo stock."); break;
        case "add-demand": openDemandModal(); break;
        case "log-waste": openWasteModal("waste"); break;
        case "log-surplus": openWasteModal("surplus"); break;
        case "open-availability": openAvailabilityModal(); break;
        case "edit-profile": openProfileModal(); break;
        case "change-roles": navigate("profile"); showToast("Manage roles below","Select roles and save in the profile page."); break;
        case "save-profile-roles": saveProfileRoles(); break;
        case "edit-kitchen": openKitchenModal(); break;
        case "kitchen-request-status": {
          const r=appState.kitchenRequests.find(r=>r.id===Number(id)); if(!r)return;
          r.status=button.dataset.status; addActivity(`${r.status} request from ${r.requester}`); renderPage(appState.page); showToast(`Request ${r.status.toLowerCase()}`, `Updated ${r.requester}'s kitchen request.`); break;
        }
        case "request-kitchen": {
          const kitchen=appState.kitchens.find(k=>k.id===Number(id)); if(!kitchen)return;
          const body=`<div class="notice full"><span>ⓘ</span><div><strong>Send a partner request to ${escapeHTML(kitchen.name)}?</strong><br>This only creates an in-memory request in the demo. The live API must verify that you can act for an organization.</div></div>${selectField("eventId","Related event",appState.events.filter(e=>e.status!=="Cancelled").map(e=>({value:e.id,label:`${e.title} — ${e.date}`})),appState.events.find(e=>e.status==="Published")?.id||"",true,true)}${textareaField("message","Request details","We would like to coordinate kitchen availability for this food-service event.","Explain the event and requested support.")}`;
          openModal("Request kitchen availability", `${kitchen.place} · capacity ${kitchen.capacity} meals/day`,body,"request-kitchen","Send request"); $("#modal-form").dataset.kitchenId=kitchen.id; break;
        }
        case "refer-volunteer": openReferralModal(id?Number(id):null); break;
        case "add-chef": openChefModal(); break;
        case "aggregation-info": openModal("Opportunity aggregation", "How public listings should enter MealSync.", `<ol style="padding-left:20px;line-height:1.8;font-size:12px"><li>Start with sources whose public opportunity pages and site terms permit collection.</li><li>Store the source, source URL, external ID if available, and last-checked time.</li><li>Normalize title, location, time and skills; deduplicate records and expire stale listings.</li><li>Keep first-party events separate from imported listings until a user reviews/imports them.</li><li>Provide manual organization submissions as a dependable fallback.</li></ol><div class="notice full"><span>ⓘ</span><div>Scraping all of India is not a one-night MVP task; build one source adapter or use seeded listings first.</div></div>`, "info", "Close"); break;
        case "external-details": showExternalDetails(id); break;
        case "suggest-import": showToast("Interest saved", "The example listing is not live. A production workflow would open the source URL and record an import review."); break;
        case "notifications": openModal("Notifications", "Recent activity in this local demo session.", appState.activity.length?appState.activity.map(a=>`<div class="list-row"><span class="avatar">♧</span><div class="grow"><strong>${escapeHTML(a.message)}</strong><small>${escapeHTML(a.time)}</small></div></div>`).join(""):emptyState("You're all caught up","New referrals, approvals and contribution updates will appear here."), "info", "Done"); break;
        case "open-help": openModal("How MealSync fits together", "Four roles sharing the same event and resource data.", `<div class="list-row"><span class="avatar">🤝</span><div class="grow"><strong>Volunteer</strong><small>Availability, skills, suggestions, registrations and referrals.</small></div></div><div class="list-row"><span class="avatar orange">💚</span><div class="grow"><strong>Donor</strong><small>Browse requests and track recorded contributions.</small></div></div><div class="list-row"><span class="avatar blue">🏢</span><div class="grow"><strong>Organization</strong><small>Publish events, manage sign-ups and discover kitchen partners.</small></div></div><div class="list-row"><span class="avatar purple">🍲</span><div class="grow"><strong>Community kitchen</strong><small>Requests, inventory, recipes, chefs, meal plans and waste tracking.</small></div></div><div class="notice full" style="margin-top:14px"><span>ⓘ</span><div>This UI is a prototype. A real deployment needs backend authentication/authorization, persistent PostgreSQL data, input validation, API error handling and secure contribution processing.</div></div>`,"info","Got it",true); break;
        case "forgot-password": showToast("Password reset is not connected", "A live application needs a server-side reset flow and verified email."); break;
        case "security-info": showToast("Security note", "Never store plaintext passwords or trust role flags sent by the browser."); break;
        case "export-donations": showToast("Export preview", "A real app can export the donation history visible in the current filter."); break;
        default: break;
      }
    });

    // BLOCK 34: Submit handling and modal-specific auxiliary actions. 
    document.addEventListener("submit", event => {
      const form=event.target.closest("form[data-form]"); if(!form)return;
      event.preventDefault();
      if(form.dataset.form === "request-kitchen") {
        const kitchenId=Number(form.dataset.kitchenId); const kitchen=appState.kitchens.find(k=>k.id===kitchenId); const data=formDataObject(form);
        const eventId=Number(data.eventId); const relatedEvent=currentEvent(eventId); if(!relatedEvent){showToast("Choose an event","Select the event this kitchen request belongs to.");return;} appState.kitchenRequests.unshift({id:Math.max(0,...appState.kitchenRequests.map(r=>r.id))+1,eventId,kitchenId,requester:"MealSync demo organizer",date:relatedEvent.date,status:"Pending",note:data.message||"Kitchen availability request"});
        addActivity(`Requested kitchen support from ${kitchen?.name||"a kitchen"}`); closeModal(); renderPage(appState.page); showToast("Kitchen request sent", "The request now appears in the kitchen workspace."); return;
      }
      if(form.dataset.form === "info" || form.dataset.form === "external-info" || form.dataset.form === "schedule-info" || form.dataset.form === "recipe-info") { closeModal(); return; }
      handleFormSubmit(form);
    });

    // BLOCK 35: Search/filter interactions do not rerender on every keystroke, preventing lost focus. 
    document.addEventListener("input", event => {
      const target=event.target;
      if(target.id === "global-search") {
        const q=target.value.trim().toLowerCase();
        $$('[data-search-text]', $("#page-content")||document).forEach(row=>row.style.display=(!q||row.dataset.searchText.includes(q))?"":"none");
      }
      if(target.id === "event-search" || target.id === "inventory-search" || target.id === "opportunity-search") {
        const q=target.value.trim().toLowerCase();
        const container=target.id==="event-search"?$("#events-results"):target.id==="inventory-search"?$("#inventory-table"):null;
        if(container) $$('[data-search-text]',container).forEach(row=>row.style.display=(!q||row.dataset.searchText.includes(q))?"":"none");
        if(target.id === "opportunity-search") {
          // Filtering needs to account for source/type fields; re-render and preserve the query after the current input is complete.
          const selectionStart=target.selectionStart; const query=target.value;
          const content=renderOpportunities(); $("#page-content").innerHTML=content;
          const replacement=$("#opportunity-search"); if(replacement){replacement.focus();replacement.setSelectionRange(selectionStart,selectionStart);}
        }
      }
      if(target.id === "estimate-recipe" || target.id === "estimate-servings") updateRecipeEstimate();
    });
    document.addEventListener("change", event => {
      const t=event.target;
      if(t.id === "event-category" || t.id === "event-location") {
        const query=$("#event-search")?.value||""; const category=$("#event-category")?.value||"all"; const location=$("#event-location")?.value||"all";
        const results=appState.events.filter(e=>e.status!=="Cancelled"&&(!query||[e.title,e.org,e.category,e.place,e.skills.join(" ")].join(" ").toLowerCase().includes(query.toLowerCase()))&&(category==="all"||e.category.toLowerCase().includes(category.toLowerCase()))&&(location==="all"||e.place.toLowerCase().includes(location.toLowerCase())));
        const holder=$("#events-results"); if(holder)holder.innerHTML=results.map(e=>eventCard(e,{showMatch:true,showRegister:true})).join("")||emptyState("No events found","Change the filters or add an event from the Organization workspace.");
      }
      if(t.id === "opportunity-category" || t.id === "opportunity-location") {
        const q=$("#opportunity-search")?.value||""; const category=t.id==="opportunity-category"?t.value:$("#opportunity-category")?.value||"all"; const location=t.id==="opportunity-location"?t.value:$("#opportunity-location")?.value||"all";
        // Re-render the content once after a filter change, then restore the new values as the renderer reads from the controls.
        const content=renderOpportunities(); $("#page-content").innerHTML=content;
        const search=$("#opportunity-search"); if(search){search.value=q;search.focus();}
      }
      if(t.id === "org-event-status") {
        const status=t.value; $$("#org-event-table tr").forEach(row=>row.style.display=status==="all"||row.dataset.status===status?"":"none");
      }
      if(t.id === "active-kitchen-select") { appState.activeKitchenId=Number(t.value); renderPage("kitchens"); }
      if(t.id === "schedule-filter") {
        const mode=t.value; const schedules=appState.schedules.filter(s=>mode==="all"||(mode==="completed"?s.status==="Completed":s.date>="2026-10-16"&&s.status!=="Completed")).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)); const holder=$("#schedule-list"); if(holder)holder.innerHTML=schedules.map(s=>scheduleRow(s)).join("")||emptyState("No schedules in this filter","Try another view or add a meal schedule.");
      }
    });

    // BLOCK 36: Shared role preferences, recipe estimator, and initial page bootstrap. 
    function saveProfileRoles() {
      const selected=$$("input[name='profileRoles']:checked").map(i=>i.value);
      if(!selected.length){showToast("Keep at least one role active","A MealSync account must have at least one role.");return;}
      appState.user.roles=selected;
      if(appState.activeRole!=="for-you" && !selected.includes(appState.activeRole)) appState.activeRole="for-you";
      addActivity(`Updated role preferences: ${selected.map(r=>roleInfo[r].label).join(", ")}`); renderPage("profile"); showToast("Role preferences saved", "The prototype now reflects your selected roles.");
    }
    function updateRecipeEstimate() {
      const recipeId=$("#estimate-recipe")?.value || "1"; const servings=Number($("#estimate-servings")?.value || 300);
      const target=$("#recipe-estimate"); if(target)target.innerHTML=renderEstimate(recipeId,Math.max(1,servings));
    }
    // Keep demo inputs predictable on reload; all state is intentionally in memory only.
    appState.availability = [
      { day:"Wednesday", start:"15:00", end:"19:00", place:"Mumbai", distance:10, skills:["Cooking","Food packing"] },
      { day:"Saturday", start:"09:00", end:"14:00", place:"Mumbai", distance:10, skills:["Cooking","Food packing","Distribution"] }
    ];
    renderLanding();
  </script>
</body>
</html>
